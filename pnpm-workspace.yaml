packages:
  - apps/api
  - apps/web

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  prisma: true
  unrs-resolver: false
overrides:
  body-parser: 2.3.0
  # 3.1.5 era a versao vulneravel (GHSA-f65p-4m7j-42xc e outros tres); o patch e 3.1.6.
  # Chega por apps/web > @hookform/resolvers > ajv.
  fast-uri: 3.1.8
  multer: 2.3.0
  qs: 6.16.0
  # Chega por apps/web > next > styled-jsx > @babel/core. Patch a partir de 4.28.7.
  browserslist: 4.28.9
  # GHSA-w5vr-8v7q-w6rv, encerramento de processo. Chega por apps/web > next.
  # A versao corrigida ja estava na arvore; o override colapsa as duas.
  baseline-browser-mapping: 2.11.25
